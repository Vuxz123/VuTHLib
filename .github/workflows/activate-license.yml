name: Activate Unity License

on:
  workflow_dispatch:
  schedule:
    # Tự động renew license mỗi tháng
    - cron: '0 0 1 * *'

jobs:
  activate:
    name: Activate License (${{ matrix.unity-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unity-version: ['2022.3.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request Manual Activation File
        uses: game-ci/unity-request-activation-file@v2
        id: get-activation-file
        with:
          unity-version: ${{ matrix.unity-version }}

      - name: Upload License File
        # Sau khi chạy job này, vào Artifacts tải license file
        # Rồi đưa vào GitHub Secrets với key UNITY_LICENSE
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-${{ matrix.unity-version }}
          path: ${{ steps.get-activation-file.outputs.activation-file }}

  # ──────────────────────────────────────────────────────────
  # Bước 2: Kích hoạt license (sau khi đã có license file)
  # ──────────────────────────────────────────────────────────
  # Sau khi lấy được license file từ job trên:
  # 1. Tải license file từ Artifacts
  # 2. Decode:   base64 -d unity_lic.ulf > decoded.ulf
  # 3. Đặt vào GitHub Secrets với key UNITY_LICENSE
  # ──────────────────────────────────────────────────────────
