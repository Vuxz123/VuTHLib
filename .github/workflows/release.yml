name: Create Release

# Publishes VuTH Lib as a UPM package.
# Source of truth: Assets/_VuTH/package.json  (the package root).
# Push a tag "v<version>" that matches package.json "version" to release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACKAGE_DIR: Assets/_VuTH

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package metadata
        id: meta
        run: |
          NAME=$(jq -r .name "$PACKAGE_DIR/package.json")
          VERSION=$(jq -r .version "$PACKAGE_DIR/package.json")
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          # Allow pre-release suffixes on the tag (v1.2.0-beta) as long as the base matches package.json.
          if [ "${TAG_VERSION%%-*}" != "${VERSION%%-*}" ]; then
            echo "::error::Tag $TAG does not match $PACKAGE_DIR/package.json version $VERSION"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$NAME-$TAG_VERSION.tgz" >> "$GITHUB_OUTPUT"

      - name: Check every C# file is covered by an asmdef
        # In a UPM package, scripts outside an assembly definition are silently NOT compiled.
        run: |
          missing=0
          while IFS= read -r f; do
            d=$(dirname "$f"); found=
            while [ "$d" != "." ] && [ "$d" != "/" ]; do
              if ls "$d"/*.asmdef >/dev/null 2>&1; then found=1; break; fi
              d=$(dirname "$d")
            done
            if [ -z "$found" ]; then echo "::error file=$f::Not covered by any .asmdef"; missing=1; fi
          done < <(find "$PACKAGE_DIR" -name '*.cs')
          exit $missing

      - name: Build UPM tarball
        # Same layout as `npm pack`: everything under a top-level "package/" folder.
        # Install in Unity: Package Manager > + > Add package from tarball...
        run: |
          mkdir -p build/package
          cp -R "$PACKAGE_DIR"/. build/package/
          tar -czf "${{ steps.meta.outputs.tarball }}" -C build package
          ls -la "${{ steps.meta.outputs.tarball }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VuTH Lib v${{ steps.meta.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.meta.outputs.tarball }}
          body: |
            ## VuTH Lib v${{ steps.meta.outputs.version }}

            ### Install (UPM, git URL) — recommended
            Add to `Packages/manifest.json`:
            ```json
            "${{ steps.meta.outputs.name }}": "https://github.com/${{ github.repository }}.git?path=Assets/_VuTH#${{ github.ref_name }}"
            ```

            ### Install (tarball)
            Download `${{ steps.meta.outputs.tarball }}` below → Package Manager → **+** → **Add package from tarball…**

            ### Prerequisites
            UPM packages cannot declare git dependencies, so add these to the consuming project first —
            see the README section **Install → Prerequisites** for the exact lines.
            - UniTask, R3, ZLinq, ZString, MessagePipe (+ VContainer bridge), VContainer 1.17.0 (git URLs)
            - PrimeTween 1.3.8 (npm scoped registry)
            - NuGet (via NuGetForUnity): R3, ZLinq, ObservableCollections(.R3), Newtonsoft.Json, System.Text.Json
